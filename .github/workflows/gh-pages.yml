# This workflow builds the documentation and publishes it to GitHub Pages.

name: Publish Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    if: ${{ github.repository == 'slaclab/pydm-converter-tool' }}
    uses: slaclab/swapps-ci-helpers/.github/workflows/docs.yml@afaac9fd67e0b31c887a48c19d9a6b219ea72a8f
    with:
      docs-tool: mkdocs
