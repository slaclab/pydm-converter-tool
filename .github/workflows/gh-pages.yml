# This workflow builds the documentation and publishes it to GitHub Pages.

name: Publish Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    if: ${{ github.repository == 'slaclab/pydm-converter-tool' }}
    uses: slaclab/swapps-ci-helpers/.github/workflows/docs.yml@ab0c25cb9b7ee308b967e43bcd885ed15b179b1f
    with:
      docs-tool: mkdocs
