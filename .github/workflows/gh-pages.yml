# This workflow builds the documentation and publishes it to GitHub Pages.

name: Publish Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    if: ${{ github.repository == 'slaclab/pydm-converter-tool' }}
    uses: slaclab/swapps-ci-helpers/.github/workflows/docs.yml@9bd3f16145f87d30ed28c044c8e51121529840e0
    with:
      docs-tool: mkdocs
